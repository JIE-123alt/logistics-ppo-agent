# Run C (final) = the BASE PPO settings. Starting values are common defaults; our runs confirm them.
run_name: run_c_final
env_config: config/env.yaml
seeds: [0, 1, 2]
train:
  total_timesteps: 500000   # adjusted after the speed test (run_all.py does the scaling)
  quick_timesteps: 20480
  n_envs: 8                 # 8 copies of the game run side by side -> more varied data per update
  learning_rate: 0.0003     # step size of each weight update (3e-4 is a common PPO default)
  lr_schedule: linear       # step size shrinks to 0 by the end -> calmer, more stable finish
  n_steps: 256              # steps each env plays before an update (8 x 256 = 2048 per update)
  batch_size: 64            # size of each mini-batch used inside an update
  n_epochs: 10              # how many times we re-use the same 2048 steps
  gamma: 0.99               # how much future cost matters (0.99 = looks ~100 weeks ahead)
  gae_lambda: 0.95          # trade-off between bias and noise when estimating advantages
  clip_range: 0.2           # PPO's safety limit: a policy update may not change probabilities by >20%
  ent_coef: 0.01            # small bonus for exploring (keeps the policy from becoming too sure too soon)
  net_arch: [64, 64]        # two hidden layers of 64 neurons for the policy and for the value network
  train_scenarios: all      # each episode uses a RANDOM scenario from the 50 train scenarios
eval:
  every_steps: 10000        # validation check every 10k steps; the best checkpoint is kept
  quick_every_steps: 4096
# Pass criteria chosen by us BEFORE running (our own choice, not an official standard).
pass_criteria:
  min_improvement_vs_random: 0.20     # (a) validation cost at least 20% below the random policy
  flat_window_fraction: 0.20          # (a) "flattened": validation cost of the last 20% of checkpoints ...
  flat_tolerance: 0.02                #     ... is within 2% of the previous 20%
  max_train_val_gap: 0.10             # (b) (val - train) / train <= 10%
  max_val_test_gap: 0.10              # (b) |test - val| / val <= 10%
  max_seed_spread: 0.10               # (c) (max - min) / mean of the 3 seeds <= 10%
