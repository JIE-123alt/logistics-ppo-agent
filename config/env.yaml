# Environment settings for SupplyChainEnv (src/env.py). ALL environment numbers live here.
# Change a number here and every script picks it up (stress tests override a few at run time).
weeks: 52                    # one episode = 52 weekly decisions (week 0 to week 51)
start_inventory: 200         # units on hand at the start of week 0
inventory_cap: 1000          # stock above this is thrown away when goods arrive (they are still paid for)
order_sizes: [0, 50, 100, 200]   # must have exactly 4 entries; action = supplier_index * 4 + size_index (A = 0, B = 1)

# Suppliers. unit_cost is paid when the goods ARRIVE (pay on delivery), not when the order is placed;
# goods still on the way after the last week are never paid for.
# Lead time = whole weeks drawn uniformly from lead_min..lead_max (both ends included).
# reliability = chance an order is NOT late; a late order takes delay_weeks extra weeks.
supplier_a: {unit_cost: 1.0, lead_min: 2, lead_max: 4, reliability: 0.8,  delay_weeks: 2}
supplier_b: {unit_cost: 1.5, lead_min: 1, lead_max: 2, reliability: 0.98, delay_weeks: 2}
fixed_order_cost: 20.0       # paid in the week of the order for every accepted order (fallback orders too), not for failed ones

# Weekly cost = holding + lost sale + fixed order cost (if an order was accepted this week)
#               + unit cost of the goods that arrive at the start of next week.
costs:
  holding: 1.0               # per unit left over at the end of the week, after that week's demand was served
  lost_sale: 5.0             # per unit of demand that could not be served (lost, not back-ordered)
  reward_scale: 100.0        # reward = -(weekly cost) / 100  (fixed number, no VecNormalize)

# An order is "failed" (lost, nothing is placed) if the order system rejects it (api_failure_prob, either
# supplier) OR it goes to Supplier A while A is "unavailable". Every failed order counts toward the
# failure streak used by the fallback rule below.
uncertainty:
  forecast_noise_std: 0.15       # forecast seen by the agent = NEXT week's expected demand * (1 + Normal(0, std)), never below 0
  signal_noise_std: 0.10         # Normal noise added to the reliability signal of Supplier A (signal is then clipped to 0..1)
  signal_normal: 0.8             # centre of A's reliability signal in a normal week
  signal_delayed: 0.4            # ... while A is "delayed" by a disruption
  signal_unavailable: 0.1        # ... while A is "unavailable" (orders to A fail)
  disruption_prob: 0.03          # chance a new disruption starts in a week with no disruption running (one at a time)
  disruption_min_weeks: 2        # a disruption lasts this many whole weeks at least ...
  disruption_max_weeks: 4        # ... and this many at most
  disruption_extra_weeks: 3      # extra lead time for an order to A placed while A is "delayed"
  disruption_unavailable_share: 0.5  # chance a new disruption is "A unavailable" (otherwise "A delayed")
  api_failure_prob: 0.05         # chance each order attempt (order size above 0) is rejected by the order system

safety:
  fallback_after_failures: 3     # after 3 failed orders in a row, the NEXT week's action is replaced by the fallback
                                 # order, even if the agent chose "order nothing". A week with no order neither adds
                                 # to nor resets the streak; an accepted order resets it. The fallback always succeeds,
                                 # is counted in fallback_rate and resets the streak.
  fallback_cover_weeks: 4        # fallback order: from Supplier B, the largest allowed size that does not exceed
                                 # (4 * forecast - stock on hand - stock on the way); nothing if that gap is below 50

# Stage 1: synthetic demand (Stage 2 would add source: real). For each scenario seed:
# base ~ Uniform(base_min, base_max), seasonal amplitude ~ Uniform(season_min, season_max) as a fraction of base,
# noise std ~ Uniform(noise_min, noise_max), and a random season phase.
# Expected demand = base * (1 + amplitude * sin(2 * pi * week / season_length_weeks + phase)).
# Actual demand = expected + Normal(0, noise), rounded, never below 0.
demand:
  source: synthetic
  base_min: 80
  base_max: 120
  season_min: 0.10
  season_max: 0.40
  noise_min: 5
  noise_max: 20
  season_length_weeks: 52        # length of one seasonal cycle

normalise:                       # numbers used to scale observations (stock numbers are divided by inventory_cap)
  forecast_scale: 200.0          # forecast / 200 goes into the observation
  obs_max: 5.0                   # observations are clipped to 0 .. obs_max

splits:                          # scenario seeds: the seed decides the demand pattern (the three ranges must not overlap)
  train: {start: 1000, count: 50}
  val:   {start: 2000, count: 20}
  test:  {start: 3000, count: 20}
