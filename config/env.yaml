# All settings for the simulation live here, so we can change them
# (for example for stress tests) without touching the code.

episode_weeks: 52          # one episode = one year of weekly decisions
start_inventory: 200       # units in the warehouse at week 0
inventory_cap: 1000        # warehouse capacity (extra stock is thrown away)

# The agent picks one of 8 actions = 4 order sizes x 2 suppliers
order_quantities: [0, 50, 100, 200]

costs:
  holding: 1.0             # cost per unit left in stock at the end of a week
  lost_sale: 5.0           # cost per unit of demand we could not serve
  fixed_order: 20.0        # fixed cost every time an order is placed
  reward_scale: 100.0      # reward = -(weekly cost) / reward_scale

suppliers:
  A:                       # cheap but slow and less reliable
    unit_cost: 1.0
    lead_min: 2            # delivery time in weeks (random between min and max)
    lead_max: 4
    late_prob: 0.2         # 20% chance the order is extra late
    late_extra_weeks: 2
  B:                       # expensive but fast and reliable
    unit_cost: 1.5
    lead_min: 1
    lead_max: 2
    late_prob: 0.02
    late_extra_weeks: 2

uncertainty:
  forecast_noise_std: 0.15          # forecast = true expected demand x (1 + noise)
  reliability_signal_noise: 0.1     # noise on the "is supplier A OK?" signal
  disruption_prob: 0.03             # chance per week that a disruption starts
  disruption_min_weeks: 2
  disruption_max_weeks: 4
  disruption_extra_delay: 2         # extra weeks for supplier A while disrupted
  disruption_signal_level: 0.4      # what the reliability signal shows during a disruption
  api_failure_prob: 0.05            # chance an order is not placed (system failure)

fallback:
  after_failures: 3        # after 3 failed orders in a row, use the safe rule once
  cover_weeks: 3           # safe rule: order up to 3 weeks of forecast demand

# A scenario seed picks one demand pattern from these ranges
scenario_ranges:
  base_demand: [80, 120]
  seasonal_amp: [0.1, 0.4]
  noise_std: [5, 20]
