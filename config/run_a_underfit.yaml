# Run A: made to UNDERFIT on purpose. Same as the base settings except for the lines below.
run_name: run_a_underfit
train:
  total_timesteps: 20000    # very short training
  learning_rate: 0.000001   # 1e-6: weights barely move
  lr_schedule: constant
  net_arch: [16]            # one tiny hidden layer
eval:
  every_steps: 2000
